name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - dev
      - "**"
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="pr-${{ github.event.number }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi

          echo "Deploying branch: $BRANCH_NAME"

          wrangler pages deploy .svelte-kit/cloudflare \
            --project-name ucalg-baja-ca \
            --branch "$BRANCH_NAME" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_COMMIT_MESSAGE}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      
      - name: Send formatted webhook
        run: |
          payload="{
          \"content\": \"${GITHUB_ACTOR}\n[${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}] 1 new commit\n${GITHUB_SHA::7} ${GITHUB_COMMIT_MESSAGE} - ${GITHUB_ACTOR}\n\n✅ Action succeeded in ${GITHUB_REPOSITORY} ${GITHUB_REF_NAME}\"
          }"

          for url in $WEBHOOK_URLS; do
            curl -s -X POST -H "Content-Type: application/json" \
              -d "$payload" "$url"
          done
        env:
          WEBHOOK_URLS: >-
            ${{ secrets.DARKICEWOLF50_WEBHOOK }}
            ${{ secrets.BAJA_WEBHOOK }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}