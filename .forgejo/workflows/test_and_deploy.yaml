name: Deploy to Cloudflare Pages

on:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build SvelteKit
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: https://forge.ucalgarybaja.ca/ucalgary-baja/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name ucalg-baja-ca
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Deployment URLs
        run: |
          echo "✅ Production / Preview URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "🔗 Branch Alias URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          echo "🌐 Full deployment details available in Cloudflare dashboard."

  test:
    needs: deploy
    runs-on: ubuntu-*
    # if: always() # Run even if deploy fails (optional)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright + dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ needs.deploy.outputs.alias_url }}
        run: npm run test

